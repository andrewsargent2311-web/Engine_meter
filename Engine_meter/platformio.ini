; Engine meter -- nice!nano (nRF52840) firmware
; Standalone PlatformIO project. In VS Code use File > Open Folder... and pick
; THIS folder (Engine_meter), not the repo root (the root platformio.ini is the ESP32 vario).
;
; "nicenano" is not a built-in PlatformIO board, so the board definition
; (boards/nicenano.json) and pin variant (boards/nicenano/) are bundled here.
; They come from https://github.com/ICantMakeThings/Nicenano-NRF52-Supermini-PlatformIO-Support
; (via https://github.com/bertrik/nicenano-example). Pin numbers are raw:
; P0.xx -> xx, P1.xx -> 32+xx, matching the numbers used in main.cpp.

[env:nicenano]
platform = nordicnrf52
board = nicenano
board_build.variants_dir = boards
framework = arduino

monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit MAX31856 library
    adafruit/Adafruit BusIO
    adafruit/Adafruit TinyUSB Library
